services:
  rack-temp-monitor:
    build: .
    image: rack-temp-monitor:latest
    container_name: rack-temp-monitor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "7431:7431"
    environment:
      PORT: 7431
      DATABASE_URL: "file:../data/db.sqlite"
      # Optional — if unset, the app generates one on first run and persists
      # it in the data volume. Set it explicitly for a multi-instance deploy.
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - rack-temp-data:/app/backend/data

volumes:
  rack-temp-data:
