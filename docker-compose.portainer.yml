# Stack for Portainer (Stacks -> Add stack -> Web editor / Upload).
# Unlike docker-compose.yml this uses a pre-built image from GHCR
# instead of "build: .", because Portainer (Web editor/Upload) doesn't build from
# a local Dockerfile. The image is published by .github/workflows/docker-publish.yml
# — :latest only moves on a published GitHub release, not on every push to
# main, so this stays on released versions.
#
# SESSION_SECRET is optional — if you don't set it in Portainer's
# "Environment variables", the app generates one on first run and persists
# it in the data volume.
#
# Auto-updates (Watchtower) are opt-in, not part of this default stack
# anymore — see docker-compose.watchtower.yml. Pulling and restarting a
# container automatically, on a fixed poll, with no review step is a
# supply-chain tradeoff worth choosing deliberately rather than getting by
# default (FASE 5.1).

services:
  rack-temp-monitor:
    image: ghcr.io/hexlions/racktemp:latest
    container_name: rack-temp-monitor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "7431:7431"
    environment:
      PORT: 7431
      DATABASE_URL: "file:../data/db.sqlite"
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - rack-temp-data:/app/backend/data
    labels:
      # Read only if docker-compose.watchtower.yml is also deployed — inert
      # otherwise, harmless to leave in place.
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  rack-temp-data:
