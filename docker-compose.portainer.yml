# Stack per Portainer (Stacks -> Add stack -> Web editor / Upload).
# A differenza di docker-compose.yml usa un'immagine pre-buildata da GHCR
# invece di "build: .", perché Portainer (Web editor/Upload) non builda da
# Dockerfile locale. L'immagine viene pubblicata da .github/workflows/docker-publish.yml
# ad ogni push su main.
#
# In Portainer, alla creazione dello stack aggiungi la variabile d'ambiente
# SESSION_SECRET (Environment variables) con una stringa lunga e casuale,
# altrimenti resta il valore di default sotto (da cambiare comunque).
#
# Include anche Watchtower: appena esce una nuova immagine su GHCR il
# controller si aggiorna e riavvia da solo, senza bisogno di webhook
# o click manuali. Se non lo vuoi, cancella il servizio "watchtower"
# e il label "com.centurylinklabs.watchtower.enable" sotto.

services:
  rack-temp-monitor:
    image: ghcr.io/hexlions/racktemp:latest
    container_name: rack-temp-monitor
    restart: unless-stopped
    ports:
      - "7431:7431"
    environment:
      PORT: 7431
      DATABASE_URL: "file:../data/db.sqlite"
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
    volumes:
      - rack-temp-data:/app/backend/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Aggiorna automaticamente SOLO rack-temp-monitor (grazie al label sopra)
  # ogni volta che esce una nuova immagine su GHCR: nessun click, nessun
  # webhook da configurare. Il volume dati non viene toccato dal riavvio.
  # Per disattivare: rimuovi questo servizio dallo stack.
  watchtower:
    # containrrr/watchtower è fermo al 2023 (progetto archiviato) e negozia
    # una versione dell'API Docker così vecchia (1.25) che i daemon Docker
    # recenti la rifiutano ("client version too old"). nickfedor/watchtower
    # è la continuazione mantenuta dello stesso progetto, stessa config.
    image: nickfedor/watchtower:latest
    container_name: rack-temp-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "21600" # 6 ore
      # Anche l'immagine aggiornata negozia comunque una versione API troppo
      # bassa su alcuni host (bug noto del client Docker Go SDK quando la
      # negoziazione automatica fallisce) — forzala esplicitamente a una
      # versione recente invece di lasciarla decidere da sola.
      DOCKER_API_VERSION: "1.44"

volumes:
  rack-temp-data:
