name: Build firmware

# Compiles the ESP32 sketch so a firmware change gets at least a compile
# check before merge. Compile only: nothing is flashed, signed or published.
# Default board options for ESP32C3 Dev Module; the README's Arduino IDE
# settings (USB CDC On Boot and so on) only change runtime behavior, not
# whether the sketch compiles.
on:
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned on purpose: bump these by hand, together with the checksum.
  ARDUINO_CLI_VERSION: "1.5.1"
  ARDUINO_CLI_SHA256: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"
  ESP32_CORE: "esp32:esp32@3.3.12"
  ESP32_INDEX_URL: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  FQBN: "esp32:esp32:esp32c3"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install arduino-cli
        run: |
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/$archive"
          echo "${ARDUINO_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/arduino-cli"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/arduino-cli" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli" >> "$GITHUB_PATH"

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_INDEX_URL"
          arduino-cli lib update-index
          # --no-deps so the dependency is pinned here too instead of
          # resolving to whatever is newest.
          arduino-cli lib install --no-deps "Adafruit SHT31 Library@2.2.2" "Adafruit BusIO@1.17.4"

      - name: Compile
        run: arduino-cli compile --fqbn "$FQBN" --warnings default firmware/rack_temp_sensor
