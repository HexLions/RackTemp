name: CodeQL

# SAST scan (backend + frontend TypeScript) — results land in the
# repo's Security > Code scanning tab, not a build gate: reviewed by a
# human, not auto-blocking a PR on a finding that might be a false
# positive. Runs on every PR (catches new issues before merge) and weekly
# (already-merged code that a CodeQL query update newly flags).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # every Monday, 07:00 UTC (an hour after the dependency audit)
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
