name: Build and publish Linux native package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build package
        run: bash scripts/build-package-linux.sh

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-linux/racktemp-linux-x64.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: racktemp-linux-x64
          path: dist-linux/racktemp-linux-x64.tar.gz
