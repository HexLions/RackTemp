name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute tags
        # :latest only moves on a published release, not on every push to
        # main (FASE 5.2) — Portainer/Watchtower deploys pinned to :latest
        # otherwise pick up unreleased, still-in-progress work the moment
        # it lands on main. A main push instead gets :edge (deliberately
        # opt-in for anyone who wants bleeding-edge) and a short-sha tag;
        # a release gets :latest, its own version tag, and a short-sha tag.
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${IMAGE}:latest
          ${IMAGE}:${{ github.event.release.tag_name }}
          ${IMAGE}:sha-${SHORT_SHA}"
          else
            TAGS="${IMAGE}:edge
          ${IMAGE}:sha-${SHORT_SHA}"
          fi
          echo "TAGS<<EOF" >> "$GITHUB_ENV"
          echo "$TAGS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
