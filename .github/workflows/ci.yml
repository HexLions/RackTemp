name: Build and test

# Every PR used to get only the dependency audit and CodeQL: nothing
# compiled the code or ran a test before merge. This builds both
# workspaces the way the Dockerfile does (same Node major) and runs each
# workspace's type-check and test suite.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
