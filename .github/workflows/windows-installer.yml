name: Build and publish Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the installer to (e.g. v1.0.2). Leave empty to only build."
        required: false
        default: ""

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer-windows.ps1

      - name: Upload installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist-windows/RackTemp-Setup-*.exe

      # Re-attaches the installer to a release whose own build failed
      # (e.g. a download outage), without re-tagging it.
      - name: Upload installer to an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # Accepts "1.0.2" as well as "v1.0.2": releases are tagged with the
        # leading v, and typing the bare version is an easy slip.
        run: |
          tag="$(echo "$RELEASE_TAG" | tr -d '[:space:]')"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          gh release upload "$tag" dist-windows/RackTemp-Setup-*.exe --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: racktemp-windows-installer
          path: dist-windows/RackTemp-Setup-*.exe
